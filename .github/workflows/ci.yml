name: HuiQiao OS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.10,<3.0" "PyYAML>=6.0" "fastapi>=0.110" "typer>=0.12" "httpx>=0.27" "pytest>=8.0"

      - name: Run full Lego brick test suite
        run: python -m pytest tests/

      - name: Run brick registry health CLI
        run: python -m packages.core.cli

      - name: Run INT-4 5-dimension release evaluation
        run: python -m evals.run_int4_eval
