# 汇桥 OS（HuiQiao OS）乐高积木装配清单（统一兼容 M00–M03）
schema_version: "huiqiao/v1"

# 1. 扁平 6 积木装配表（供 python -m packages.core.cli 与基础集成测试验证）
bricks:
  - name: "ingest"
    role: "B01"
    impl: "packages.core.mock_bricks:MockIngest"
    fallback_impl: "packages.core.mock_bricks:MockIngestFallback"
  - name: "router"
    role: "B02"
    impl: "packages.core.mock_bricks:MockRouter"
    fallback_impl: "packages.core.mock_bricks:MockRouterFallback"
  - name: "orchestrator"
    role: "B03"
    impl: "packages.core.mock_bricks:MockOrchestrator"
  - name: "llm_gateway"
    role: "B04"
    impl: "packages.core.mock_bricks:MockLLMGateway"
  - name: "gate"
    role: "B10"
    impl: "packages.core.mock_bricks:MockGate"
  - name: "ledger"
    role: "B08"
    impl: "packages.core.mock_bricks:MockLedger"

# 2. 按层多候选热插拔槽位（后续真实积木接入此区）
slots:
  llm_gateway:
    active: "mock-llm-gateway"
    bricks:
      mock-llm-gateway:
        brick_id: "b04-mock-llm-gateway"
        layer: "llm_gateway"
        version: "0.1.0"
        contract_version: "huiqiao/v1"
        entrypoint: "packages.core.registry:NullBrick"
        capabilities: ["healthcheck"]
        enabled: false
        note: "M01 真实适配器就绪后切为 enabled: true"

  sandbox:
    active: "m08-tiered-sandbox"
    bricks:
      m08-tiered-sandbox:
        brick_id: "b07-tiered-sandbox"
        layer: "sandbox"
        version: "1.0.0"
        contract_version: "huiqiao/v1"
        entrypoint: "packages.sandbox.manager:SandboxManager"
        capabilities: ["t1_restricted_ast", "t2_os_audit_sandbox", "t3_docker_hardened", "fail_closed"]
        enabled: false
        note: "M08 三级本地安全沙箱（T1 纯计算 / T2 OS 原生审计 / T3 硬化容器 Fail-Closed）"
      mock-sandbox:
        brick_id: "b07-mock-sandbox"
        layer: "sandbox"
        version: "0.1.0"
        contract_version: "huiqiao/v1"
        entrypoint: "packages.core.registry:NullBrick"
        capabilities: ["healthcheck"]
        enabled: false
        note: "M00 占位桩（已被 m08-tiered-sandbox 替代）"

  memory:
    active: "m10-file-first-memory"
    bricks:
      m10-file-first-memory:
        brick_id: "b08-file-first-memory"
        layer: "memory"
        version: "1.0.0"
        contract_version: "huiqiao/v1"
        entrypoint: "packages.memory.store:FileFirstMemoryStore"
        capabilities: ["file_first_markdown", "sqlite_fts5_hybrid", "bi_temporal", "human_editable_forget"]
        enabled: false
        note: "M10 File-First 分层本地记忆引擎（MEMORY.md + 每日日志 + SQLite FTS5/向量混合双时态）"
      mock-memory:
        brick_id: "b08-mock-memory"
        layer: "memory"
        version: "0.1.0"
        contract_version: "huiqiao/v1"
        entrypoint: "packages.core.registry:NullBrick"
        capabilities: ["healthcheck"]
        enabled: false
        note: "M00 占位桩（已被 m10-file-first-memory 替代）"

  governance:
    active: "m04-governance-guard"
    bricks:
      m04-governance-guard:
        brick_id: "b10-governance-guard"
        layer: "governance"
        version: "1.0.0"
        contract_version: "huiqiao/v1"
        entrypoint: "packages.governance.guard:GovernanceGuard"
        capabilities: ["lifecycle_hooks", "work_mode_guard", "evidence_gate", "diff_preview"]
        enabled: false
        note: "M04 已落盘并通过 22 项越权与性能单测"

  ingress:
    active: "m07-local-gateway"
    bricks:
      m07-local-gateway:
        brick_id: "b01-local-gateway"
        layer: "ingress"
        version: "1.0.0"
        contract_version: "huiqiao/v1"
        entrypoint: "packages.gateway.service:HuiQiaoService"
        capabilities: ["fastapi_http", "websocket_stream", "typer_cli", "genesis_skills"]
        enabled: false
        note: "统一网关（集成 CLI / FastAPI / WebSocket / 沙箱 / 记忆 / 自演化）"

  skill_engine:
    active: "m11-dual-gate-evolution"
    bricks:
      m11-dual-gate-evolution:
        brick_id: "b09-dual-gate-evolution"
        layer: "skill_engine"
        version: "1.0.0"
        contract_version: "huiqiao/v1"
        entrypoint: "packages.evolution.engine:SelfEvolutionEngine"
        capabilities: ["objective_sandbox_gate", "c00_uplift_veto", "human_review", "portable_lite_export"]
        enabled: false
        note: "M11 双闸门防坍塌自演化引擎与高配反哺低配普惠技能导出"
